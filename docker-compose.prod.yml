services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jira_report
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jira_prod_password_change_me}
    volumes:
      - jira_report_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jira -d jira_report"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://jira:${POSTGRES_PASSWORD:-jira_prod_password_change_me}@db:5432/jira_report
    expose:
      - "8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8100:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  jira_report_pgdata:
  caddy_data:
  caddy_config:
